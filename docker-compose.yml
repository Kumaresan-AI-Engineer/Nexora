# Local PostgreSQL only. Run the API and frontend directly (see README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pharmasource
      POSTGRES_PASSWORD: pharmasource
      POSTGRES_DB: pharmasource
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmasource"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
